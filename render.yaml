services:
  - type: web
    name: wildlife-monitoring-ai
    env: python
    buildCommand: cd backend && pip install -r requirements-prod.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wildlife-db
          property: connectionString

databases:
  - name: wildlife-db
    databaseName: wildlife
    user: wildlife_user

